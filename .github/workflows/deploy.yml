name: Build Parquet App executable

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install Pillow

      - name: Ensure root static directory exists
        shell: pwsh
        run: |
          if (-not (Test-Path static)) {
            New-Item -ItemType Directory -Path static | Out-Null
          }

      - name: Build Windows executable from spec
        shell: pwsh
        run: pyinstaller --noconfirm --clean ParquetApp.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParquetApp-windows
          path: dist/ParquetApp.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/ParquetApp.exe
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
